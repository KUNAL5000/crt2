<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard with Coordinates</title>
    <style>
        .board-container {
            display: grid;
            grid-template-columns: 30px repeat(8, 60px) 30px;
            grid-template-rows: 30px repeat(8, 60px) 30px;
            border: 2px solid #000;
            width: max-content;
            background: #fff;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .label {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            color: #000;
            font-size: 14px;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            user-select: none;
        }
        .light {
            background-color: #ffffff;
            color: #000;
        }
        .dark {
            background-color: #000000;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="board-container">
    <!-- Top Labels -->
    <div class="label"></div>
    <div class="label">A</div><div class="label">B</div><div class="label">C</div><div class="label">D</div>
    <div class="label">E</div><div class="label">F</div><div class="label">G</div><div class="label">H</div>
    <div class="label"></div>

    <!-- Row 8 -->
    <div class="label">8</div>
    <div class="square dark">♜</div><div class="square light">♞</div><div class="square dark">♝</div><div class="square light">♛</div>
    <div class="square dark">♚</div><div class="square light">♝</div><div class="square dark">♞</div><div class="square light">♜</div>
    <div class="label">8</div>

    <!-- Row 7 -->
    <div class="label">7</div>
    <div class="square light">♟</div><div class="square dark">♟</div><div class="square light">♟</div><div class="square dark">♟</div>
    <div class="square light">♟</div><div class="square dark">♟</div><div class="square light">♟</div><div class="square dark">♟</div>
    <div class="label">7</div>

    <!-- Row 6 -->
    <div class="label">6</div>
    <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
    <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
    <div class="label">6</div>

    <!-- Row 5 -->
    <div class="label">5</div>
    <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
    <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
    <div class="label">5</div>

    <!-- Row 4 -->
    <div class="label">4</div>
    <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
    <div class="square dark"></div><div class="square light"></div><div class="square dark"></div><div class="square light"></div>
    <div class="label">4</div>

    <!-- Row 3 -->
    <div class="label">3</div>
    <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
    <div class="square light"></div><div class="square dark"></div><div class="square light"></div><div class="square dark"></div>
    <div class="label">3</div>

    <!-- Row 2 -->
    <div class="label">2</div>
    <div class="square dark">♙</div><div class="square light">♙</div><div class="square dark">♙</div><div class="square light">♙</div>
    <div class="square dark">♙</div><div class="square light">♙</div><div class="square dark">♙</div><div class="square light">♙</div>
    <div class="label">2</div>

    <!-- Row 1 -->
    <div class="label">1</div>
    <div class="square light">♖</div><div class="square dark">♘</div><div class="square light">♗</div><div class="square dark">♕</div>
    <div class="square light">♔</div><div class="square dark">♗</div><div class="square light">♘</div><div class="square dark">♖</div>
    <div class="label">1</div>

    <!-- Bottom Labels -->
    <div class="label"></div>
    <div class="label">A</div><div class="label">B</div><div class="label">C</div><div class="label">D</div>
    <div class="label">E</div><div class="label">F</div><div class="label">G</div><div class="label">H</div>
    <div class="label"></div>
</div>

</body>
</html>
