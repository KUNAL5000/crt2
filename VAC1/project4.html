<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #121212;
    color: #f5f5f5;
    min-height: 100vh;
  }

  .top-bar {
    display: flex;
    justify-content: center;
    padding: 40px 0;
    border-bottom: 1px solid #2a2a2a;
  }
  .logo-icon {
    width: 200px;
    height: 90px;
    border-radius: 100px;
    background: linear-gradient(135deg, #f9ce34, #ee2a7b, #6228d7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;   
    font-weight: 700;
    color: white;
  }

  .login-wrap {
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }
  .login-box {
    width: 100%;
    max-width: 420px;
  }
  .login-box h2 {
    font-size: 22px;
    margin-bottom: 24px;
  }

  .input-group { margin-bottom: 14px; }
  .input-group input {
    width: 100%;
    padding: 16px;
    font-size: 15px;
    background: transparent;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    color: #f5f5f5;
    outline: none;
  }
  .input-group input::placeholder { color: #8a8a8a; }
  .input-group input:focus { border-color: #6a6a6a; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    margin-top: 4px;
    background: #2b5c9e;
    color: #b7c6da;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 24px;
    cursor: pointer;
  }
  .btn-primary:hover { background: #326bb5; }

  .forgot-link {
    display: block;
    text-align: center;
    color: #f5f5f5;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    margin: 24px 0;
  }

  .btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: #262626;
    color: #d0d0d0;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .btn-social:hover { background: #2f2f2f; }
  .btn-social .icon-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #3b5998;
    flex-shrink: 0;
  }

  .btn-secondary {
    display: block;
    width: 100%;
    text-align: center;
    padding: 14px;
    background: transparent;
    color: #4fa1f5;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid #3a3a3a;
    border-radius: 24px;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-secondary:hover { background: #1c1c1c; }

  .brand-footer {
    text-align: center;
    margin-top: 28px;
    font-size: 14px;
    color: #8a8a8a;
    font-weight: 600;
  }

  @media (max-width: 500px) {
    .login-wrap { padding: 40px 16px; }
    .logo-icon { width: 70px; height: 70px; font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="logo-icon" font-weight="700">instagram</div>
  </div>

  <div class="login-wrap">
    <div class="login-box">
      <h2>Log into your account</h2>
      <form onsubmit="return false;">
        <div class="input-group">
          <input type="text" placeholder="Mobile number, username or email" autocomplete="username">
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <a href="#" class="forgot-link">Forgot password?</a>

      <button class="btn-social">
        login with facebook
      </button>

      <a href="#" class="btn-secondary">Create new account</a>

      <div class="brand-footer">Meta</div>
    </div>
  </div>

</body>
</html>
