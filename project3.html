<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body 

  .left {
    flex: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    position: relative;
  }
  .preview-stack {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 340px;
  }
  
  .avatar {
    position: absolute;
    left: 260px; top: 220px;
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 4px solid #1877f2;
    background: #f2c9b3;
  }

  .divider { width: 1px; background: #dadde1; }

  .right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .login-box { width: 100%; max-width: 400px; }
  .login-box h2 { font-size: 22px; margin-bottom: 24px; color: #1c1e21; }

  .input-group { margin-bottom: 14px; }
  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4b4f56;
    margin-bottom: 6px;
  }
  .input-group input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid #ccd0d5;
    border-radius: 8px;
    outline: none;
  }
  .input-group input:focus {
    border-color: #1877f2;
    box-shadow: 0 0 0 2px rgba(24,119,242,0.2);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: #1877f2;
    color: white;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #166fe5; }

  .forgot-link {
    display: block;
    text-align: center;
    color: #1877f2;
    text-decoration: none;
    font-size: 15px;
    margin: 16px 0 20px;
  }

  hr { border: none; border-top: 1px solid #dadde1; margin: 20px 0; }

  .btn-secondary {
    display: block;
    width: 100%;
    text-align: center;
    padding: 14px;
    background: #42b72a;
    color: white;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-secondary:hover { background: #36a420; }

  @media (max-width: 850px) {
    body { flex-direction: column; }
    .divider { display: none; }
    .left { padding: 30px; }
    .preview-stack { height: 260px; }
    .card.one { width: 150px; height: 200px; }
    .card.two { width: 170px; height: 230px; left: 160px; }
    .card.three { width: 130px; height: 170px; left: 70px; top: 80px; }
    .avatar { left: 190px; top: 160px; width: 70px; height: 70px; }
  }
</style>
</head>
<body>
  <div class="left">
    <div class="preview-stack">
      <div class="card one"></div>
      <div class="card two"></div>
      <div class="card three"></div>
      <div class="avatar"></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="right">
    <div class="login-box">
      <h2>Log in to your account</h2>
      <form onsubmit="return false;">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Email address or user name" autocomplete="username">
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <a href="#" class="forgot-link">Forgotten password?</a>
      <hr>
      <button class="btn-secondary">Create new account</button>
    </div>
  </div>
</body>
</html>
