<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>


<body>
    <form action="#">
        <h2>Registration form</h2>

        <div>
            <label for="rollno">Roll No:</label>
            <input type="integer" id="rollno" name="rollno" placeholder="Enter your roll number" required>
        </div>
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="First name" required><input type="text" id="name" name="name" placeholder="Last name" required>
        </div>
        <div>
            <label for="father_name">Father's name</label>
            <input type="text" id="father_name" name="father_name" placeholder="Enter your father's name" required>
        </div>
        <div>
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" placeholder="Year" required>
        </div>
        <div>
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        

        <div>
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required>
            <label for="female">Female</label>
        </div>
        <div>
            <label for="Department">Department</label>
            <select id="Department" name="Department" required>
                <option value="">Select your department</option>
                <option value="bca">CSE</option>
                <option value="bsc">IT</option>
                <option value="bcom">ECE</option>
                <option value="ba">Civil</option>
                <option value="ba">Mech.</option>
            </select>
        </div>

        <div>
            <label for="city" >City:</label>
            <input type="text" id="city" name="city" placeholder="Enter your city" required>
        </div>

        <div>
            <label for="address">Address:</label>
            <textarea id="address" name="address" placeholder="Enter your address" required></textarea>

        <button type="submit">Submit</button>


    </form>


</body>
</html>
